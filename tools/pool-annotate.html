<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>规则池人工标注</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px/1.4 -apple-system, "PingFang SC", sans-serif; background: #1e2127; color: #c8ccd4; }
  header { position: sticky; top: 0; z-index: 1; padding: 6px 16px; background: #16181d; border-bottom: 1px solid #333; }
  header .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  header b { color: #fff; }
  .help { margin-top: 4px; color: #7f848e; font-size: 12px; }
  button, select { font: inherit; background: #2c313a; color: #d7dae0; border: 1px solid #444; border-radius: 5px; padding: 2px 8px; cursor: pointer; }
  button:hover { background: #3a404b; }
  #pos { min-width: 70px; text-align: center; color: #fff; font-variant-numeric: tabular-nums; }
  main { max-width: 1200px; margin: 0 auto; padding: 8px 16px; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 6px; }
  .scope { font: 16px/1.3 ui-monospace, Menlo, monospace; color: #fff; word-break: break-all; }
  .meta { color: #9aa1ad; font-size: 12px; }
  .meta code { color: #d7dae0; }
  .cand, .themes { display: grid; grid-template-columns: 96px 20px 180px 1fr; gap: 8px; align-items: center; padding: 1px 6px; }
  .cand { border-radius: 5px; cursor: pointer; border: 1px solid transparent; }
  .cand:hover { background: #262a31; }
  .cand.chosen { border-color: #61afef; background: #22303f; }
  .themes { color: #7f848e; font-size: 11px; }
  .themes div:last-child, .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  /* 柱形右对齐, 从右往左画; 票数在柱左侧 */
  .vote { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #9aa1ad; }
  .vote .n { width: 16px; text-align: right; font-variant-numeric: tabular-nums; }
  .vote .track { flex: 1; height: 8px; background: #2c313a; border-radius: 4px; overflow: hidden; display: flex; justify-content: flex-end; }
  .vote .fill { height: 100%; background: #61afef; border-radius: 4px; }
  .key { width: 20px; height: 20px; border-radius: 4px; background: #2c313a; display: grid; place-items: center; font-weight: 600; font-size: 12px; }
  .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { display: inline-block; margin-left: 4px; padding: 0 4px; border-radius: 3px; font-size: 11px; line-height: 16px; }
  .badge.combo { background: #2f4a2a; color: #98c379; }
  .badge.intuit { background: #4a3a22; color: #e5c07b; }
  .chip { padding: 1px 6px; border-radius: 4px; font: 12px/18px ui-monospace, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .done { color: #98c379; }
  .bar { flex: 1; min-width: 120px; height: 6px; background: #2c313a; border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #98c379; }
</style>
</head>
<body>
<header>
  <div class="row">
    <button id="prev">← 上一个</button><span id="pos"></span><button id="next">下一个 →</button>
    <span>已标注 <b id="progress"></b></span>
    <div class="bar"><i id="bar"></i></div>
    <label>筛选 <select id="filter"><option value="todo">未标注</option><option value="all">全部</option></select></label>
    <button id="acceptAll" title="把当前筛选里所有未标注项设为综合推荐">剩余全部采用综合推荐</button>
    <button id="export">导出 pool-overrides.json</button>
  </div>
  <div class="help">
    <b>1-9 a-z</b> 选候选 · <b>Enter</b> <span class="badge combo">综合推荐</span> · <b>空格</b> <span class="badge intuit">直觉推荐</span>(按命名约定) · <b>← →</b> 翻页 · <b>Backspace</b> 清除 · <b>0</b> 全部角色 ·
    柱形 = 原主题投票数 · 进度自动保存, 导出后存为 <code>tools/sources/pool-overrides.json</code>
  </div>
</header>
<main>
  <div id="card"></div>
</main>
<script>
const DATA = /*__DATA__*/null;
const KEY = 'pool-annotate-v1';
const saved = Object.assign({}, DATA.annotated, JSON.parse(localStorage.getItem(KEY) || '{}'));
let filter = 'todo', index = 0;

const $ = id => document.getElementById(id);
const name = r => DATA.names[r] || r;
const LANGS = new Set(['js','ts','tsx','jsx','json','python','html','css','scss','markdown','go','rust','java','c','cpp','cs','php','ruby','shell','yaml','sql','xml','vue','less','lua','swift','kotlin','dart']);
const GENERIC = new Set(['begin','end','definition','other','language','source','meta','support','entity','name']);

function sample(scope) {
  const segs = scope.split(' ').pop().split('.');
  for (let i = segs.length - 1; i >= 0; i--) {
    if (!LANGS.has(segs[i]) && !GENERIC.has(segs[i])) return segs[i];
  }
  return 'token';
}
function list() {
  return DATA.items.filter(it => filter === 'all' || !(it.scope in saved));
}
const KEYS = '123456789abcdefghijklmnopqrstuvwxyz';
// 全部有票的角色按票数排序, 推荐与已标注的角色即使没票也列出, 最后是"跟随外层"
function candidates(it) {
  const out = Object.keys(it.votes).sort((a, b) => it.votes[b] - it.votes[a]);
  for (const r of [it.recommended, it.struct, saved[it.scope], 'inherit']) if (r && !out.includes(r)) out.push(r);
  return out.slice(0, KEYS.length);
}
function chip(p, role, word) {
  const c = p.roles[role] || p.fg;
  return `<div class="chip" style="background:${p.bg};color:${p.fg}">a = <span style="color:${c}">${word}</span>(b)</div>`;
}
const TIER = {3: '结构规则被多数原主题反对', 4: '只有一个原主题定义', 5: '原主题之间分歧'};
function render() {
  const items = list();
  const done = DATA.items.filter(it => it.scope in saved).length;
  $('progress').textContent = `${done} / ${DATA.items.length}`;
  $('bar').style.width = `${(100 * done / DATA.items.length).toFixed(1)}%`;
  if (!items.length) {
    $('card').innerHTML = '<p class="done">当前筛选下没有待标注项. 可以导出了.</p>';
    $('pos').textContent = '';
    return;
  }
  index = Math.max(0, Math.min(index, items.length - 1));
  const it = items[index], word = sample(it.scope), chosen = saved[it.scope];
  const max = Math.max(1, ...Object.values(it.votes));
  $('card').innerHTML = `
    <div class="head">
      <div class="scope">${it.scope}</div>
      <div class="meta">${TIER[it.tier]} · 定义它的原主题 ${it.themes} 个${chosen ? ` · <span class="done">已标注: ${name(chosen)}</span>` : ''}</div>
      <select id="all"><option value="">全部角色…</option>${DATA.roles.map(r => `<option value="${r}" ${r === chosen ? 'selected' : ''}>${name(r)}</option>`).join('')}</select>
    </div>
    <div class="themes"><div style="text-align:right">投票</div><div></div><div></div><div>${DATA.previews.map(p => `<span>${p.name}</span>`).join('')}</div></div>
    ${candidates(it).map((r, i) => `
      <div class="cand ${r === chosen ? 'chosen' : ''}" data-role="${r}">
        <div class="vote"><span class="n">${it.votes[r] || ''}</span><div class="track"><div class="fill" style="width:${(100 * (it.votes[r] || 0) / max).toFixed(0)}%"></div></div></div>
        <div class="key">${KEYS[i]}</div>
        <div class="name">${name(r)}${r === it.recommended ? '<span class="badge combo">综合推荐</span>' : ''}${r === it.struct ? '<span class="badge intuit">直觉推荐</span>' : ''}</div>
        <div class="chips">${DATA.previews.map(p => chip(p, r, word)).join('')}</div>
      </div>`).join('')}`;
  $('pos').textContent = `${index + 1} / ${items.length}`;
  document.querySelectorAll('.cand').forEach(el => el.onclick = () => choose(el.dataset.role));
  $('all').onchange = e => e.target.value && choose(e.target.value);
}
function persist() { localStorage.setItem(KEY, JSON.stringify(saved)); }
function choose(role) {
  const it = list()[index];
  if (!it) return;
  saved[it.scope] = role;
  persist();
  if (filter === 'all') index++;
  render();
}
function move(d) { index += d; render(); }

$('filter').onchange = e => { filter = e.target.value; index = 0; render(); };
$('prev').onclick = () => move(-1);
$('next').onclick = () => move(1);
$('acceptAll').onclick = () => {
  const items = list().filter(it => !(it.scope in saved));
  if (!items.length || !confirm(`把 ${items.length} 个未标注项设为推荐值?`)) return;
  for (const it of items) saved[it.scope] = it.recommended;
  persist(); render();
};
$('export').onclick = () => {
  const out = Object.fromEntries(Object.keys(saved).sort().map(k => [k, saved[k]]));
  const blob = new Blob([JSON.stringify(out, null, '\t') + '\n'], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'pool-overrides.json'; a.click();
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const it = list()[index];
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = KEYS.indexOf(e.key.toLowerCase());
  if (e.key.length === 1 && k >= 0 && it) { const c = candidates(it)[k]; if (c) choose(c); }
  else if (e.key === 'Enter' && it) choose(it.recommended);
  else if (e.key === ' ' && it) { e.preventDefault(); if (it.struct) choose(it.struct); }  // 没有直觉推荐(无结构规则)时不动作
  else if (e.key === 'ArrowRight') move(1);
  else if (e.key === 'ArrowLeft') move(-1);
  else if (e.key === 'Backspace' && it) { delete saved[it.scope]; persist(); render(); }
  else if (e.key === '0') { const s = $('all'); s && s.focus(); }
});
render();
</script>
</body>
</html>
