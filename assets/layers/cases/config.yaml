# service config
server:
  host: 0.0.0.0
  port: 8080
  debug: false
  timeout: 30s
  tags: [api, "public", 'v2']
database:
  url: postgres://localhost:5432/app
  max_conns: 10
  ratio: 0.75
  anchors: &default
    retries: 3
  <<: *default
jobs:
  - name: sync
    cron: "*/5 * * * *"
    enabled: true
    env: null
